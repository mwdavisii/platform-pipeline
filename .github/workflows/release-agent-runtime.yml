name: release-agent-runtime

# The agent runtime (images/agent-runtime) every agent app is FROM. It is released with the builder's version and before it: tag
# agent-runtime-v<builder.VERSION>, pin the digest in platform/platform.json (images.agent.runtime) with scripts/configure.py, then
# tag builder-v<builder.VERSION> (the builder image bakes platform.json, so the runtime's digest must be in it first).

on:
  push:
    tags: ["agent-runtime-v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a commit on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::agent runtime tags must point at a commit that is on main"; exit 1; }
      - name: Require the tag to be agent-runtime-v<builder.VERSION>
        run: |
          set -euo pipefail
          version=$(sed -n 's/^VERSION = "\([0-9][0-9.]*\)"$/\1/p' src/builder/__init__.py)
          [ -n "$version" ] && [ "$GITHUB_REF_NAME" = "agent-runtime-v$version" ] \
            || { echo "::error::the tag is $GITHUB_REF_NAME but builder.VERSION is ${version:-missing}: tag agent-runtime-v$version (the runtime is released with the builder's version, before builder-v$version)"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build, push, and sign the agent runtime image
        id: image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/golden-road-agent-runtime"
          docker buildx build -f images/agent-runtime/Dockerfile --sbom=true --provenance=mode=max \
            --tag "$image:${GITHUB_REF_NAME}" --push --metadata-file build.json images/agent-runtime
          digest=$(jq -r '."containerimage.digest"' build.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::build produced no digest"; exit 1; }
          cosign sign --yes "$image@$digest"
          {
            echo "Agent runtime image: \`$image@$digest\`"
            echo ""
            echo "Pin it before tagging the builder: \`scripts/configure.py ... --agent-runtime-image $image@$digest\`, then commit platform/platform.json and the regenerated template."
          } >> "$GITHUB_STEP_SUMMARY"
