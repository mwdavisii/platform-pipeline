name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tests
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'
          .venv/bin/pytest -q
          .venv/bin/pytest -q -m docker tests/pipeline/test_workflows.py tests/pipeline/test_builder_image_docker.py tests/pipeline/test_authz_probe_docker.py tests/pipeline/test_scorecard_image_docker.py
