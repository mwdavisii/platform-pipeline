# Builds and publishes a skill release when an admin pushes a skill-vX.Y.Z tag on main (the skill-tags ruleset lets only
# admins create, move or delete them). Every agent's stub verifies the bundle and its own files against this workflow,
# this repository and the tag, so this file is the signer the whole kit trusts.
name: release-skill

on:
  push:
    tags: ["skill-v*"]

permissions: {}

concurrency:
  group: release-skill
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a skill-vX.Y.Z tag on a commit that is on main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^skill-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::skill tags are skill-vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::skill tags must point at a commit that is on main"; exit 1; }
      - name: Build the release assets
        run: |
          set -euo pipefail
          python3 -I scripts/build_release.py "${GITHUB_REF_NAME#skill-v}" dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: dist/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$ATTESTATION" "dist/${GITHUB_REF_NAME}.sigstore.json"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$GITHUB_REF_NAME" \
            --notes "Golden-road skill ${GITHUB_REF_NAME#skill-v}. The stub verifies every asset with gh attestation verify against this repository's release-skill.yml and this tag."
