# Documented, not applied: the cluster's operators apply this by hand beside cluster-secret-store.yaml (see README.md). External
# Secrets Operator's pods may resolve names through kube-dns, reach the Kubernetes API server (the controller watches
# ExternalSecrets and writes their Secrets there) and reach the Secret Server on 443, nothing else. Set matchName to the real host. Mock only: there is no Secret Server.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-to-secret-server
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"
    - toEntities: [kube-apiserver]
    - toFQDNs:
        - matchName: secretserver.example.invalid
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
