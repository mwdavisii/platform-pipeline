# Documented, not applied: no adapter points at external-secrets/, so nothing reconciles it (see README.md). The cluster's operators
# install External Secrets Operator, create the Secret golden-road-eso (the username and password of the Secret Server application
# account security made) in namespace external-secrets by hand, set serverURL to the real host, and apply this file by hand.
# Mock only: there is no Secret Server. This file names the credential Secret; it never holds a credential.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: delinea-secret-server
spec:
  conditions:
    - namespaceRegexes: ["^[a-z0-9-]+-(test|prod)$"]
  provider:
    secretserver:
      serverURL: https://secretserver.example.invalid
      username:
        secretRef: {name: golden-road-eso, key: username, namespace: external-secrets}
      password:
        secretRef: {name: golden-road-eso, key: password, namespace: external-secrets}
