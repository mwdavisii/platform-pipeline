name: scorecard-factory intake
description: >-
  Copies this repository's trusted scorecard inputs (the config and the registration rules, and its intake, confirmed N/A and suppression files)
  out of the factory commit the runner downloaded for this action, into a new directory in the workspace.
inputs:
  path:
    description: The directory to create in the workspace. It must not exist yet.
    required: false
    default: factory
  repository:
    description: The app repository whose records are copied (owner/name). The per-app workflow leaves it at the calling repository; scorecard-assess passes the PR's repository.
    required: false
    default: ${{ github.repository }}
outputs:
  path:
    description: The directory holding config/, intake/, na/ and suppressions/ for this repository only.
    value: ${{ steps.copy.outputs.path }}
runs:
  using: composite
  steps:
    - id: copy
      shell: bash
      env:
        DEST: ${{ inputs.path }}
        REPO: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        [[ "$DEST" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::intake: path must be a plain directory name"; exit 1; }
        { [ ! -e "$DEST" ] && [ ! -L "$DEST" ]; } || { echo "::error::intake: $DEST already exists"; exit 1; }
        [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::intake: unexpected repository name"; exit 1; }
        owner="${REPO%%/*}"
        name="${REPO#*/}"
        case "$owner" in .|..) echo "::error::intake: unexpected repository name"; exit 1;; esac
        case "$name" in .|..) echo "::error::intake: unexpected repository name"; exit 1;; esac
        # This file is .github/actions/intake/action.yml in the factory, so the factory's root is three levels up.
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd -P)"
        { [ -f "$root/config/scorecard.yaml" ] && [ ! -L "$root/config/scorecard.yaml" ]; } || { echo "::error::intake: the factory has no config/scorecard.yaml"; exit 1; }
        for dir in config intake na suppressions; do
          if [ -e "$root/$dir" ]; then
            links="$(find "$root/$dir" -type l -print -quit)" || { echo "::error::intake: can't scan the factory's $dir/ for symlinks"; exit 1; }
            [ -z "$links" ] || { echo "::error::intake: the factory's $dir/ holds a symlink"; exit 1; }
          fi
        done
        mkdir -p "$DEST/config" "$DEST/intake/$owner" "$DEST/na/$owner" "$DEST/suppressions/$owner"
        cp "$root/config/scorecard.yaml" "$DEST/config/scorecard.yaml"
        # T-21's floor rules. A factory without them still runs: the scorecard fires T-14 for rules it can't read.
        if [ -f "$root/config/registration.yaml" ]; then cp "$root/config/registration.yaml" "$DEST/config/registration.yaml"; fi
        for kind in intake na; do
          if [ -f "$root/$kind/$owner/$name.yaml" ]; then cp "$root/$kind/$owner/$name.yaml" "$DEST/$kind/$owner/$name.yaml"; fi
        done
        if [ -d "$root/suppressions/$owner/$name" ]; then cp -R "$root/suppressions/$owner/$name" "$DEST/suppressions/$owner/$name"; fi
        echo "path=$DEST" >> "$GITHUB_OUTPUT"
