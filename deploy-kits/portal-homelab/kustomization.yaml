# The golden-road portal on a home k3s cluster. manifests.yaml is the verified release's asset: download it next to this file
# (README, "Verify the release"). It is never committed. Edit only the values marked REPLACE.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: golden-road-portal
resources:
- manifests.yaml
- namespace.yaml
- postgres.yaml
- migrate-job.yaml
- writer.yaml
- collector.yaml
- networkpolicies.yaml

# Non-secret settings. The name is the one the release's web Deployment reads (golden-road-portal-config), so the hash suffix is off.
# After changing a value, restart the three Deployments' pods (README, "Change a setting").
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- name: golden-road-portal-config
  literals:
  - PORTAL_BASE_URL=https://viber.mwdavisii.com
  - PORTAL_ORG=mwdavisii
  - PORTAL_GITHUB_HOST=github.com
  - 'PORTAL_ROLE_GROUPS={"admin": ["golden-road-admins"], "ops": ["golden-road-ops"]}'
  # REPLACE: the Authentik provider's issuer URL. Its host must also be the matchName in networkpolicies.yaml (oidc-egress).
  - PORTAL_OIDC_ISSUER=https://authentik.replace-me.invalid/application/o/golden-road-portal/
  # REPLACE: the Authentik client id, and the read App's OAuth client id (both are public values).
  - PORTAL_OIDC_CLIENT_ID=replace-me
  - PORTAL_GITHUB_OAUTH_CLIENT_ID=replace-me
  # REPLACE: the two GitHub Apps' ids and the ids of their installations on the organization.
  - PORTAL_READ_APP_ID=replace-me
  - PORTAL_READ_INSTALLATION_ID=replace-me
  - PORTAL_WRITE_APP_ID=replace-me
  - PORTAL_WRITE_INSTALLATION_ID=replace-me
  # REPLACE: the platform's model_gateway_hosts (platform/platform.json), comma-separated
  - PORTAL_MODEL_GATEWAY_HOSTS=litellm.replace-me.invalid
  # App connections (an app's Azure identity and Databricks connection), off while empty. PORTAL_DIRECTORY=mock turns them on for
  # the web and the writer at once; the two links are optional pages describing the owning teams' processes.
  - PORTAL_DIRECTORY=
  # Seconds after which the collector's view of a person's admin repos is too old to act on (60 to 604800). Empty is the default,
  # 600. The web and the writer both read this one key, so they can't differ.
  - PORTAL_REPO_ADMINS_STALE_AFTER=
  - PORTAL_IDENTITY_PROCESS_URL=
  - PORTAL_DATA_PROCESS_URL=
  # App secrets from Delinea Secret Server, off while empty. PORTAL_SECRET_SERVER=mock (the only one there is) turns them on for the
  # web and the writer at once; the link is an optional page describing how security shares a secret with golden-road-eso.
  - PORTAL_SECRET_SERVER=
  - PORTAL_SECRET_PROCESS_URL=
  # MCP servers from the shared Cloudflare MCP gateways, on with the mock (the only Cloudflare there is). The web and the writer read
  # all three keys, so they can't differ. The gateways: set them to configure.py's --mcp-gateway-test/--mcp-gateway-prod; empty is
  # mcp-test.example.com and mcp.example.com, the placeholders; deploy-check refuses a binding whose gateway isn't platform.json's.
  - PORTAL_CLOUDFLARE=mock
  - PORTAL_MCP_GATEWAY_TEST=
  - PORTAL_MCP_GATEWAY_PROD=
  # An optional https page that says how to ask for a server to be added to a gateway (linked on the app page; empty hides it).
  - PORTAL_MCP_PROCESS_URL=
  # Skills from the platform's catalog, on with the mock (the fixture deploy-check reads too). The web and the writer read it.
  - PORTAL_SKILLS_CATALOG=mock
  # The CMDB record, on with the mock: the collector syncs intake records to it, and the web shows the CMDB card and timeline step.
  - PORTAL_SERVICENOW=mock
  # The ownership notice. The organization's name (empty is: the organization) and the grace days (empty is 30; 0 hides the day count).
  - PORTAL_ORG_NAME=
  - PORTAL_LIFECYCLE_GRACE_DAYS=
  # The data classification policy the register and approval forms link to (https; empty hides the link). Set it to the same URL as
  # configure.py --classification-policy-url; this is the placeholder until then.
  - PORTAL_CLASSIFICATION_POLICY_URL=https://policies.example.com/data-classification
  # Days after which an open re-review item is flagged stale on the Re-review page (0 turns the flag off). Empty is the default, 30.
  - PORTAL_REREVIEW_STALE_DAYS=
  # The collector's re-review settings. Days before a review date when it shows as due soon (0 turns that reason off; empty is 30); the
  # scorecard signals that put an app on the list (trigger IDs, recorded signals, security_review; empty is the default:
  # security_review, T-17, T-18, T-19, egress-removed); and the storage hosts an artifact download may be redirected to (name or
  # *.suffix; empty is *.blob.core.windows.net, github.com's; the egress policy below is the narrower gate).
  - PORTAL_REVIEW_DUE_SOON_DAYS=
  - PORTAL_REREVIEW_SIGNALS=
  - PORTAL_ARTIFACT_HOSTS=

# One image for every process: the writer, the collector and the migration job take the image of the release's web Deployment,
# so they can never drift from it.
replacements:
- source:
    kind: Deployment
    name: golden-road-portal
    fieldPath: spec.template.spec.containers.[name=app].image
  targets:
  - select:
      kind: Deployment
      name: golden-road-portal-writer
    fieldPaths:
    - spec.template.spec.containers.[name=writer].image
  - select:
      kind: Deployment
      name: golden-road-portal-collector
    fieldPaths:
    - spec.template.spec.containers.[name=collector].image
  - select:
      kind: Job
      name: golden-road-portal-migrate
    fieldPaths:
    - spec.template.spec.containers.[name=migrate].image
