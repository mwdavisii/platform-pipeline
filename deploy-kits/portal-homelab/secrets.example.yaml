# Names and keys only. This file is NOT in kustomization.yaml and must never hold a real value.
# Copy it OUTSIDE the repository (or into your secret manager), fill the values, and apply it before the kit (README, "Apply").
#
# Passwords: make five unrelated ones, for example `openssl rand -hex 24` (hex needs no URL escaping). Each database password is
# written twice, once in golden-road-portal-postgres (the init script creates the roles with it) and once in the process's URL:
#   postgresql://<role>:<password>@golden-road-portal-postgres:5432/portal
# with <role> portal_web, portal_writer, portal_collector, and portal_owner for the migration job.
# The App keys are the PEM private keys GitHub gives you when you generate one for each App.
apiVersion: v1
kind: Secret
metadata:
  name: golden-road-portal-postgres
  namespace: golden-road-portal
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_ME
  PORTAL_OWNER_PASSWORD: REPLACE_ME
  PORTAL_WEB_PASSWORD: REPLACE_ME
  PORTAL_WRITER_PASSWORD: REPLACE_ME
  PORTAL_COLLECTOR_PASSWORD: REPLACE_ME
---
# The web pods (the name and keys the release's Deployment reads).
apiVersion: v1
kind: Secret
metadata:
  name: golden-road-portal-secrets
  namespace: golden-road-portal
type: Opaque
stringData:
  PORTAL_OIDC_CLIENT_SECRET: REPLACE_ME
  PORTAL_GITHUB_OAUTH_CLIENT_SECRET: REPLACE_ME
  PORTAL_DATABASE_URL: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: golden-road-portal-writer
  namespace: golden-road-portal
type: Opaque
stringData:
  PORTAL_DATABASE_URL: REPLACE_ME
  write-app.pem: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: golden-road-portal-collector
  namespace: golden-road-portal
type: Opaque
stringData:
  PORTAL_DATABASE_URL: REPLACE_ME
  read-app.pem: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: golden-road-portal-migrate
  namespace: golden-road-portal
type: Opaque
stringData:
  PORTAL_MIGRATE_DATABASE_URL: REPLACE_ME
