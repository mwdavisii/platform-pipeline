# The writer: the only process that writes to git (spec P17). It holds the write App's key and nobody else does, and the lifecycle
# App's key (spec 2026-11-02 L9), which no other pod gets. It refuses to start until the factory's rulesets are split the way its bypass check wants (README, "Checks after deploy").
# One replica, and Recreate, so two writers never run at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-road-portal-writer
  labels:
    app.kubernetes.io/name: golden-road-portal-writer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: golden-road-portal-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golden-road-portal-writer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: writer
        image: replaced-from-the-web-deployment
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "portal.writer"]
        env:
        - name: PORTAL_GITHUB_HOST
          valueFrom:
            configMapKeyRef:
              name: golden-road-portal-config
              key: PORTAL_GITHUB_HOST
        - name: PORTAL_ORG
          valueFrom:
            configMapKeyRef:
              name: golden-road-portal-config
              key: PORTAL_ORG
        - name: PORTAL_ROLE_GROUPS
          valueFrom:
            configMapKeyRef:
              name: golden-road-portal-config
              key: PORTAL_ROLE_GROUPS
        - name: PORTAL_WRITE_APP_ID
          valueFrom:
            configMapKeyRef:
              name: golden-road-portal-config
              key: PORTAL_WRITE_APP_ID
        - name: PORTAL_WRITE_INSTALLATION_ID
          valueFrom:
            configMapKeyRef:
              name: golden-road-portal-config
              key: PORTAL_WRITE_INSTALLATION_ID
        - name: PORTAL_DIRECTORY  # the directory the web links from; the writer re-checks every binding against the same one
          valueFrom:
            configMapKeyRef:
              name: golden-road-portal-config
              key: PORTAL_DIRECTORY
              optional: true
        - name: PORTAL_SECRET_SERVER  # the Secret Server the web picks from; the writer re-checks every binding secret against the same one
          valueFrom:
            configMapKeyRef:
              name: golden-road-portal-config
              key: PORTAL_SECRET_SERVER
              optional: true
        - name: PORTAL_CLOUDFLARE  # the Cloudflare the web picks MCP servers from; the writer re-checks every binding server against it
          valueFrom:
            configMapKeyRef:
              name: golden-road-portal-config
              key: PORTAL_CLOUDFLARE
              optional: true
        - name: PORTAL_MCP_GATEWAY_TEST  # the web's test gateway; the writer holds a binding's mcp.gateway to it
          valueFrom:
            configMapKeyRef:
              name: golden-road-portal-config
              key: PORTAL_MCP_GATEWAY_TEST
              optional: true
        - name: PORTAL_MCP_GATEWAY_PROD  # the web's prod gateway; the writer holds a binding's mcp.gateway to it
          valueFrom:
            configMapKeyRef:
              name: golden-road-portal-config
              key: PORTAL_MCP_GATEWAY_PROD
              optional: true
        - name: PORTAL_SKILLS_CATALOG  # the catalog the web picks from; the writer re-checks each skill and composes the skills ConfigMap from it
          valueFrom:
            configMapKeyRef:
              name: golden-road-portal-config
              key: PORTAL_SKILLS_CATALOG
              optional: true
        - name: PORTAL_REPO_ADMINS_STALE_AFTER  # the web's limit: a binding's requester must be a recent admin of the repo
          valueFrom:
            configMapKeyRef:
              name: golden-road-portal-config
              key: PORTAL_REPO_ADMINS_STALE_AFTER
              optional: true
        - name: PORTAL_WRITE_APP_KEY_FILE
          value: /secrets/write-app/write-app.pem
        # The lifecycle App (spec 2026-11-02 L9): optional for the writer, which reads both settings or neither (without them a
        # decommission is refused; suspend and resume need neither). The kit always sets the key file's path, so fill both keys of the
        # writer's Secret, or remove these two entries to run without it (README, "Lifecycle (0.7.0)").
        - name: PORTAL_LIFECYCLE_APP_ID
          valueFrom:
            secretKeyRef:
              name: golden-road-portal-writer
              key: PORTAL_LIFECYCLE_APP_ID
              optional: true
        - name: PORTAL_LIFECYCLE_APP_KEY_FILE
          value: /secrets/lifecycle-app/lifecycle-app.pem
        - name: PORTAL_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: golden-road-portal-writer
              key: PORTAL_DATABASE_URL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: write-app-key
          mountPath: /secrets/write-app
          readOnly: true
        - name: lifecycle-app-key
          mountPath: /secrets/lifecycle-app
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: write-app-key
        secret:
          secretName: golden-road-portal-writer
          defaultMode: 288  # octal 0440: the group (fsGroup 10001) reads the key, nobody else
          items:
          - key: write-app.pem
            path: write-app.pem
      - name: lifecycle-app-key  # optional: an empty directory until the Secret holds lifecycle-app.pem
        secret:
          secretName: golden-road-portal-writer
          optional: true
          defaultMode: 288  # octal 0440, as the write App's key
          items:
          - key: lifecycle-app.pem
            path: lifecycle-app.pem
