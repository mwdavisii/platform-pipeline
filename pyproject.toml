[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "golden-road"
version = "0.1.0"
description = "Platform contracts and the builder CLI for secure container delivery"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.22", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "uv>=0.4"]

[project.scripts]
builder = "builder.cli:main"
golden-road = "golden_road.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contracts = ["schemas/*.json"]
builder = ["data/*.json", "data/authz/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests", "reference/security-scans/tests"]
addopts = "-m 'not docker'"
markers = ["docker: builds and runs container images (run with: pytest -m docker)"]
