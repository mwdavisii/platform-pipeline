# Base apps for the golden cases. Each case changes one of them in a PR.
notes:
  files:
    app.py: |
      from fastapi import FastAPI, Header, HTTPException

      app = FastAPI()
      NOTES = {}


      @app.get("/healthz")
      def healthz():
          return {"ok": True}


      @app.get("/api/notes/{note_id}")
      def get_note(note_id: str, x_user: str = Header(...)):
          note = NOTES.get(note_id)
          if note is None or note["owner"] != x_user:
              raise HTTPException(status_code=404)
          return note


      @app.delete("/api/notes/{note_id}")
      def delete_note(note_id: str, x_user: str = Header(...), x_roles: str = Header("")):
          if "writer" not in x_roles.split(","):
              raise HTTPException(status_code=403)
          note = NOTES.get(note_id)
          if note is None or note["owner"] != x_user:
              raise HTTPException(status_code=404)
          del NOTES[note_id]
          return {"deleted": note_id}
    tests/test_api.py: |
      from fastapi.testclient import TestClient

      from app import NOTES, app

      client = TestClient(app)


      def test_other_users_cannot_read_a_note():
          NOTES["n1"] = {"owner": "ana", "text": "hi"}
          assert client.get("/api/notes/n1", headers={"x-user": "bo"}).status_code == 404


      def test_readers_cannot_delete():
          NOTES["n2"] = {"owner": "ana", "text": "hi"}
          assert client.delete("/api/notes/n2", headers={"x-user": "ana", "x-roles": "reader"}).status_code == 403
    requirements.txt: |
      fastapi==0.115.0
    README.md: |
      # Notes

      Short team notes.
    builder-spec.json: |
      {"app_name": "notes-api", "app_type": "python", "entrypoint": "app:app", "server": "uvicorn", "port": 8080,
       "health_path": "/healthz", "data_classification": "internal",
       "egress": [{"host": "litellm.internal", "port": 443, "reason": "model calls through the platform gateway"}],
       "env": [{"name": "NOTES_DB_URL", "secret": true}], "resources_tier": "default",
       "authz": {"roles": [{"name": "reader", "access": "read"}, {"name": "writer", "access": "write"}], "default": "deny",
                 "rules": [{"methods": ["GET"], "path": "/api/**", "roles": ["reader", "writer"]},
                           {"methods": ["DELETE", "PATCH", "POST", "PUT"], "path": "/api/**", "roles": ["writer"]}]}}
