name: ac13-missing-line
description: "AC-13: an agent pass cites a line that doesn't exist. It is downgraded to needs_human and the level is at least elevated."
app: notes
intake: {tier: moderate, data_classification: internal, purpose: "Stores short team notes. It does not send email, call external APIs, or store files."}
change:
  append: {app.py: "\n\n# Notes are kept in memory for now.\n"}
expect: {triggers: [T-12], level: elevated}
oracle:
  default: {status: pass, evidence: [{file: app.py, text: 'if note is None or note["owner"] != x_user:'}]}
  answers:
    v5.0.0-16.2.5: {status: pass, evidence: [{file: app.py, line: 999, snippet: 'if note is None or note["owner"] != x_user:'}]}
