name: ac2-idor
description: "AC-2: the PR drops the ownership check from get_note, so any user can read any note (IDOR). V8.2.2 fails with verified evidence."
app: notes
intake: {tier: moderate, data_classification: internal, purpose: "Stores short team notes. It does not send email, call external APIs, or store files."}
change:
  replace:
    app.py:
      - old: "    if note is None or note[\"owner\"] != x_user:\n        raise HTTPException(status_code=404)\n    return note\n"
        new: "    if note is None:\n        raise HTTPException(status_code=404)\n    return note\n"
expect: {triggers: [T-1], fail_chapters: [v5.0.0-8], level: security_review}
oracle:
  default: {status: pass, evidence: [{file: app.py, text: 'if note is None or note["owner"] != x_user:'}]}
  answers:
    v5.0.0-8.2.2: {status: fail, justification: "get_note returns any note without checking its owner", evidence: [{file: app.py, text: "if note is None:"}]}
