name: charter-logs
description: "Charter (data handling): update_note logs the whole request body. The intake classification is phi, so VC-6 is a security review."
app: notes
intake: {tier: moderate, data_classification: phi, purpose: "Stores short care-team notes about patients. It does not send email, call external APIs, or store files."}
change:
  append:
    app.py: |


      import logging

      log = logging.getLogger("notes")


      @app.put("/api/notes/{note_id}")
      def update_note(note_id: str, body: dict, x_user: str = Header(...)):
          note = NOTES.get(note_id)
          if note is None or note["owner"] != x_user:
              raise HTTPException(status_code=404)
          log.info("update from %s: %s", x_user, body)
          note["text"] = str(body.get("text", ""))
          return note
expect: {triggers: [T-10], fail_chapters: [v5.0.0-16], level: security_review}
oracle:
  default: {status: pass, evidence: [{file: app.py, text: 'if note is None or note["owner"] != x_user:'}]}
  answers:
    v5.0.0-16.2.5: {status: fail, finding_refs: [F1], evidence: [{file: app.py, text: 'log.info("update from %s: %s", x_user, body)'}]}
  findings:
    - ref: F1
      rule_id: vc-6/body-logged
      category: data-handling
      severity: high
      confidence: high
      location: {kind: file, file: app.py}
      evidence: [{file: app.py, text: 'log.info("update from %s: %s", x_user, body)'}]
      title: Note text is written to the logs
      rationale: update_note logs the request body, which holds the note text.
      fix: {summary: "Log the note ID and the user only.", steps: []}
      standards: [{framework: golden-road-vc, id: VC-6}, {framework: asvs-5.0, id: v5.0.0-16.2.5}]
