# Generated once from small FastAPI apps; edit in place. `fake` answers cite exact file text and line.
- name: read-token-writes
  description: 'An app-issued API key marked scope read can POST: the handler checks only that the key exists, never its scope. Platform roles
    never see it. T-22 runs in shadow, so the level stays standard.'
  base:
    app.py: |
      from fastapi import FastAPI

      app = FastAPI()
      NOTES = []


      @app.get("/healthz")
      def healthz():
          return {"ok": True}


      @app.get("/api/notes")
      def list_notes():
          return NOTES


      @app.post("/api/notes")
      def add_note(note: dict):
          NOTES.append(note.get("text", ""))
          return {"count": len(NOTES)}
    requirements.txt: |
      fastapi==0.115.0 \
          --hash=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      uvicorn==0.30.0 \
          --hash=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    builder-spec.json: |
      {
        "app_name": "notes-api",
        "app_type": "python",
        "entrypoint": "app:app",
        "server": "uvicorn",
        "port": 8080,
        "health_path": "/healthz",
        "data_classification": "internal",
        "egress": [
          {
            "host": "litellm.internal",
            "port": 443,
            "reason": "model calls through the platform gateway"
          }
        ],
        "env": [
          {
            "name": "NOTES_DB_URL",
            "secret": true
          }
        ],
        "resources_tier": "default",
        "authz": {
          "roles": [
            {
              "name": "reader",
              "access": "read"
            },
            {
              "name": "writer",
              "access": "write"
            }
          ],
          "default": "deny",
          "rules": [
            {
              "methods": [
                "GET"
              ],
              "path": "/api/**",
              "roles": [
                "reader",
                "writer"
              ]
            },
            {
              "methods": [
                "DELETE",
                "PATCH",
                "POST",
                "PUT"
              ],
              "path": "/api/**",
              "roles": [
                "writer"
              ]
            }
          ]
        }
      }
    README.md: |
      # Notes

      Short team notes.
  change:
    app.py: |
      from fastapi import FastAPI, Depends, Header, HTTPException

      app = FastAPI()
      NOTES = []
      API_KEYS = {"k1": {"scope": "read"}}


      def require_key(x_api_key: str = Header(default="")):
          if x_api_key not in API_KEYS:
              raise HTTPException(status_code=401)
          return x_api_key


      @app.get("/healthz")
      def healthz():
          return {"ok": True}


      @app.get("/api/notes")
      def list_notes():
          return NOTES


      @app.post("/api/notes")
      def add_note(note: dict, key: str = Depends(require_key)):
          NOTES.append(note.get("text", ""))
          return {"count": len(NOTES)}
  expect:
    answers:
      own_credentials: 'yes'
      mutates_on_read_route: 'no'
      personal_data: 'no'
    level: standard
    fired: []
    shadow:
    - T-22
  fake:
    own_credentials:
      answer: 'yes'
      justification: The app keeps its own API keys and require_key checks only that the key exists; the scope is never read.
      evidence:
      - file: app.py
        start_line: 5
        snippet: 'API_KEYS = {"k1": {"scope": "read"}}'
